apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: kagent-guardian-template
  namespace: kagent
  annotations:
    update-ts: "20261123120000"
    kagent.dev/version: "2.0.1"
  labels:
    app: kagent-guardian-agent
    capability: platform-sre
    role: worker
spec:
  description: "Kagent 平台巡检自愈与 GitOps 闭环守护专家: 专职负责 Kagent 与 Substrate 运行时高可用体检、合成会话探针检测、根因推导与基于 GitHub PR 及 ArgoCD 的 GitOps 安全自愈。"
  modelConfig:
    name: default-model-config
  systemPromptFrom:
    name: kagent-guardian-prompts
    key: kagent-guardian-prompt
  tools:
  # 1. 接入 MCP Proxy 管控的 K8s 只读工具集
  - mcp:
      server:
        kind: RemoteMCPServer
        name: mcp-proxy-k8s-read
      tools:
      - k8s_get_resources
      - k8s_describe_resource
      - k8s_get_resource_yaml
      - k8s_get_pod_logs
      - k8s_get_events
      - k8s_check_service_connectivity
      - k8s_get_cluster_configuration
      - k8s_get_available_api_resources
  # 2. 接入 MCP Proxy 管控的 Prometheus 监控与 Argo Rollouts 工具集
  - mcp:
      server:
        kind: RemoteMCPServer
        name: mcp-proxy-kagent-tool
      tools:
      - prometheus_promql_tool
      - prometheus_query_tool
      - prometheus_query_range_tool
      - argo_rollouts_list
      - argo_check_plugin_logs
  # 3. 接入 MCP Proxy 管控的 K8sGPT 只读诊断工具
  - mcp:
      server:
        kind: RemoteMCPServer
        name: mcp-proxy-k8sgpt-read
      tools:
      - analyze
      - cluster-info
      - get-logs
      - get-resource
      - list-events
      - list-filters
      - list-integrations
      - list-namespaces
      - list-resources
  # 4. 接入 MCP Proxy 管控的 GitHub 运维工具集 (支持分支/文件/PR创建，敏感 merge 受网关 PEP 审批保护)
  - mcp:
      server:
        kind: RemoteMCPServer
        name: mcp-proxy-github-ops
      tools:
      - github_create_branch
      - github_create_or_update_file
      - github_create_pull_request
      - github_delete_file
      - github_issue_write
      - github_merge_pull_request
      - github_push_files
      - github_update_issue_comment
      - github_update_pull_request
      - github_update_pull_request_branch
      - github_add_issue_comment
      - agentstage_approval_result


